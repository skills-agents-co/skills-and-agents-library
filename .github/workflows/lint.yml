name: lint

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Lint SKILL.md frontmatter
        run: |
          node <<'NODE'
          const { readFileSync, readdirSync, statSync, existsSync } = require('node:fs');
          const { join } = require('node:path');

          // The SKILL.md files use the Claude Code skill plugin format.
          // Required keys are minimal: name and description. Anything richer
          // belongs in the catalog frontmatter at uristocrat-skills/src/content/.
          const REQUIRED_KEYS = ['name', 'description'];

          const skillFiles = [];

          function walk(dir) {
            for (const name of readdirSync(dir)) {
              if (name.startsWith('.') || name === 'node_modules' || name === 'scripts') continue;
              const full = join(dir, name);
              const st = statSync(full);
              if (st.isDirectory()) walk(full);
              else if (name === 'SKILL.md' || (name.endsWith('.md') && full.includes('/agents/'))) {
                skillFiles.push(full);
              }
            }
          }
          walk(process.cwd());

          let fail = 0;

          for (const file of skillFiles) {
            const raw = readFileSync(file, 'utf8');
            if (!raw.startsWith('---\n')) {
              console.error('FAIL ' + file + ': no frontmatter');
              fail++; continue;
            }
            const end = raw.indexOf('\n---', 4);
            if (end === -1) {
              console.error('FAIL ' + file + ': unterminated frontmatter');
              fail++; continue;
            }
            const fmBlock = raw.slice(4, end);
            const body = raw.slice(end + 4);
            const keys = new Set();
            for (const line of fmBlock.split('\n')) {
              const m = line.match(/^([A-Za-z0-9_]+):/);
              if (m) keys.add(m[1]);
            }
            let fileFail = 0;
            for (const k of REQUIRED_KEYS) {
              if (!keys.has(k)) {
                console.error('FAIL ' + file + ': missing key "' + k + '"');
                fileFail++;
              }
            }
            // em-dash check in body, ignoring code blocks
            const lines = body.split('\n');
            let inCode = false;
            for (let i = 0; i < lines.length; i++) {
              const line = lines[i];
              if (line.trimStart().startsWith('```')) { inCode = !inCode; continue; }
              if (inCode) continue;
              if (line.includes('—')) {
                console.error('WARN ' + file + ':' + (i + 1) + ': em dash in body');
              }
            }
            fail += fileFail;
            if (fileFail === 0) console.log('OK   ' + file);
          }

          if (fail > 0) { console.error('Lint failures: ' + fail); process.exit(1); }
          NODE

      - name: Generate index.json
        run: node scripts/build-index.mjs --tag "${GITHUB_REF_NAME}"

      - name: Install smoke test (only on push to a tag)
        if: startsWith(github.ref, 'refs/tags/')
        run: bash scripts/test-install.sh
